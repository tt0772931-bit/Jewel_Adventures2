<style>
/* Layout: full-bleed 3D canvas, HUD on top, joystick lower-left, jump lower-right. Night-sky adventure look, single theme by design. */
:root{
  --bg:#0f1b2d;
  --ink:#f6f0e1;
  --gold:#ffc83d;
  --lava:#ff5a3c;
  --mint:#5fe3b1;
  --panel:rgba(9,16,30,.72);
  --line:rgba(246,240,225,.18);
  --display:'Lalezar','Cairo',system-ui,sans-serif;
  --body:'Cairo',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
#app{position:relative;height:100%}
.hud{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;pointer-events:none}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:2px 12px;font-family:var(--display);font-size:20px;line-height:1.5;display:flex;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums}
.chip small{font-family:var(--body);font-size:12px;opacity:.7}
.chip.gem b{color:var(--gold);font-weight:400}
.chip.life b{color:var(--lava);font-weight:400;letter-spacing:2px}
.chip.time b{color:var(--mint);font-weight:400}
.chip.time.low b{color:var(--lava)}
#zone{position:absolute;left:0;bottom:0;width:58%;height:46%}
#base{position:absolute;width:112px;height:112px;border-radius:50%;border:2px solid var(--line);background:rgba(246,240,225,.06);pointer-events:none;transition:opacity .2s}
#knob{position:absolute;left:30px;top:30px;width:52px;height:52px;border-radius:50%;background:rgba(246,240,225,.55);border:2px solid rgba(255,255,255,.7)}
#jump{position:absolute;right:6px;bottom:30px;width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,200,61,.8);background:rgba(255,200,61,.22);color:var(--ink);font-family:var(--display);font-size:24px;display:grid;place-items:center;cursor:pointer}
#jump:active,#jump.on{background:rgba(255,200,61,.5)}
.screen{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,14,26,.78);z-index:5}
.screen[hidden]{display:none}
.card{width:min(420px,100%);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:8px}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,64px);line-height:1.1;margin:0;color:var(--gold);text-wrap:balance}
.card p{margin:0;font-size:16px;line-height:1.7;max-width:34ch;text-wrap:balance}
.card .hint{font-size:14px;opacity:.75}
.card .best{font-family:var(--display);font-size:20px;color:var(--mint)}
.card button{font-family:var(--display);font-size:26px;color:#1a1305;background:var(--gold);border:0;border-radius:14px;padding:6px 34px;cursor:pointer}
.card button:focus-visible,#jump:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
#toast{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
#toast.show{opacity:1;transform:none}
#toast b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(38px,11vw,60px);color:var(--ink);text-shadow:0 3px 0 rgba(0,0,0,.35)}
#toast span{display:inline-block;margin-top:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px 14px;font-size:15px}
#flash{position:fixed;inset:0;background:var(--lava);opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:.38;transition:none}
@media (prefers-reduced-motion:reduce){#toast,#flash{transition:none}}
</style>

<div id="app" dir="rtl" lang="ar">

</div>

  var gems=Math.min(3+n,14);
  return {
    gems:gems,
    enemies:Math.min(Math.floor(1+n*0.8),9),
    eSpeed:Math.min(1.7+n*0.28,5.4),

  if(objs.group){ scene.remove(objs.group); }
  objs.group=new THREE.Group(); scene.add(objs.group);
  objs.gems=[]; objs.enemies=[]; objs.bars=[]; objs.lavas=[]; objs.portal=null;
}

function spot(list,r,lim){
  var best=null;
  for(var i=0;i<80;i++){
    var x=(Math.random()*2-1)*lim, z=(Math.random()*2-1)*lim, ok=true;
    for(var k=0;k<list.length;k++){

    }
    best={x:x,z:z};
    if(ok) return best;
  }
  return best;
}
